<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etch-a-Sketch</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    
    <h1>Etch-a-Sketch</h1>

    <div class="button-container">
        <button id="resize" class="yellow">Resize Grid</button>
        <button id="singleColor">Single Color Mode</button>
        <button id="multiColor">Random Color Mode</button>
        <button id="darken">Progressive Darkening Mode</button>
        <button id="resketch" class="yellow">Sketch Again!</button>
    </div>

    <div id="container"></div>

</body>
</html>
